<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA-инструменты для тестировщика</title>
<style>
:root {
  --bg: #0f172a;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --accent: #22c55e;
  --card: #1e293b;
  --border: #334155;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px;
}
section { margin: 0 0 40px; }
h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 16px; }
h2 { font-size: 1.25rem; margin: 0 0 12px; }
h3 { font-size: 1rem; margin: 16px 0 6px; color: var(--muted); }
p { margin: 0 0 12px; }

#tool { text-align: center; }
textarea {
  display: block;
  width: 100%;
  min-height: 120px;
  padding: 12px;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
  resize: vertical;
}
textarea::placeholder { color: var(--muted); }
button {
  min-height: 44px;
  padding: 10px 20px;
  font: inherit;
  font-weight: 600;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
}
button.primary {
  background: var(--accent);
  color: #052e16;
  border-color: var(--accent);
  width: 100%;
  margin-top: 12px;
}
button[hidden] { display: none; }
#hint { min-height: 1.5em; margin: 8px 0 0; color: var(--muted); }
#result { text-align: left; margin-top: 16px; }
#result ul { list-style: none; margin: 0; padding: 0; }
#result li { padding: 6px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
#result li::before { content: "\2610\00a0"; color: var(--muted); }
#csv { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <section id="tool">
    <h1>Чек-лист по описанию фичи за секунды</h1>
    <label for="desc" class="sr" style="position:absolute;left:-9999px">Описание фичи</label>
    <textarea id="desc" placeholder="Описание фичи, например: форма входа с паролем"></textarea>
    <button id="build" class="primary" type="button">Собрать чек-лист</button>
    <p id="hint" role="status"></p>
    <div id="result"></div>
    <button id="csv" type="button" hidden>Скачать для Excel (.csv)</button>
  </section>
  <section id="problem"><h2>Заглушка: боль и решение</h2></section>
  <section id="rules"><h2>Заглушка: свои правила</h2></section>
  <section id="soon"><h2>Заглушка: скоро</h2></section>
  <footer id="footer"></footer>
</main>
<script id="app">
// Логика страницы. Чистые функции верхнего уровня; DOM-обвязка внизу.

var DEFAULT_GROUP = 'Общие проверки';
var DEFAULT_CHECKS = [
  'Основной сценарий выполняется от начала до конца',
  'Граничные значения входных данных',
  'Пустые и некорректные данные',
  'Сообщения об ошибках понятны и на нужном языке',
  'Поведение после перезагрузки и повторного действия',
  'Отображение на разных размерах экрана'
];

function normalize(text) {
  return String(text).toLowerCase().replace(/ё/g, 'е').trim();
}

// Основа ключевого слова: отрезаем окончание, чтобы «пароль» совпадало с «пароля», «паролем».
function stem(key) {
  var k = normalize(key);
  if (k.length >= 6) return k.slice(0, -2);
  if (k.length >= 4) return k.slice(0, -1);
  return k;
}

function getRules() {
  return [
    { keys: ['пароль', 'password'], group: 'Пароль', checks: [
      'Минимальная и максимальная длина пароля',
      'Пароль маскируется при вводе, есть переключатель показа',
      'Неверный пароль даёт понятную ошибку без раскрытия, что именно неверно',
      'Спецсимволы, пробелы и юникод в пароле',
      'Сброс и смена пароля'
    ] },
    { keys: ['форма', 'form', 'анкета'], group: 'Форма', checks: [
      'Отправка с пустыми обязательными полями',
      'Подсветка и текст ошибок у каждого поля',
      'Данные сохраняются при ошибке валидации',
      'Повторная отправка (двойной клик) не создаёт дубль',
      'Навигация с клавиатуры: Tab и Enter'
    ] },
    { keys: ['поле', 'ввод', 'input'], group: 'Поля ввода', checks: [
      'Пустое значение',
      'Очень длинное значение',
      'Пробелы в начале и конце',
      'Спецсимволы и HTML-теги',
      'Вставка из буфера обмена'
    ] },
    { keys: ['файл', 'загруз', 'upload'], group: 'Загрузка файла', checks: [
      'Допустимые и недопустимые форматы',
      'Файл максимального размера и больше',
      'Пустой файл и файл с русским именем',
      'Отмена и обрыв загрузки',
      'Повторная загрузка того же файла'
    ] },
    { keys: ['оплат', 'платеж', 'платёж', 'payment', 'карта'], group: 'Оплата', checks: [
      'Успешная оплата и подтверждение',
      'Отказ банка и недостаточно средств',
      'Повторное нажатие «Оплатить» не списывает дважды',
      'Некорректный номер карты и срок действия',
      'Возврат и отмена платежа',
      'Сумма и валюта отображаются верно'
    ] },
    { keys: ['поиск', 'search', 'фильтр'], group: 'Поиск и фильтры', checks: [
      'Пустой запрос',
      'Запрос без результатов',
      'Регистр и спецсимволы в запросе',
      'Сочетание нескольких фильтров',
      'Сброс фильтров'
    ] },
    { keys: ['вход', 'логин', 'авториз', 'login'], group: 'Авторизация', checks: [
      'Вход с верными данными',
      'Вход с неверным логином или паролем',
      'Блокировка после нескольких неудачных попыток',
      'Сессия после закрытия вкладки и выхода',
      'Доступ к закрытым страницам без входа'
    ] },
    { keys: ['регистр', 'signup', 'аккаунт'], group: 'Регистрация', checks: [
      'Регистрация с уже существующей почтой',
      'Проверка формата почты и телефона',
      'Подтверждение почты и повторная отправка письма',
      'Обязательные согласия',
      'Первый вход после регистрации'
    ] },
    { keys: ['список', 'таблиц', 'пагин'], group: 'Списки и таблицы', checks: [
      'Пустой список',
      'Один элемент и очень много элементов',
      'Сортировка и постраничный вывод',
      'Длинные значения в ячейках',
      'Обновление списка после изменения данных'
    ] },
    { keys: ['уведомл', 'email', 'письм', 'notification'], group: 'Уведомления', checks: [
      'Уведомление приходит один раз',
      'Текст и тема без ошибок и пустых подстановок',
      'Отключение уведомлений',
      'Поведение при недоступной почте или сети'
    ] }
  ];
}

function matchRules(description, rules) {
  var words = normalize(description).split(/[^a-zа-я0-9]+/).filter(Boolean);
  return rules.filter(function (rule) {
    return rule.keys.some(function (key) {
      var s = stem(key);
      return s.length > 0 && words.some(function (w) { return w.indexOf(s) === 0; });
    });
  });
}

function buildChecklist(description, customRules) {
  if (!normalize(description)) return { items: [], usedDefault: false };
  var matched = matchRules(description, getRules().concat(customRules || []));
  var seen = {};
  var items = [];
  function add(group, text) {
    var k = group + '\u0000' + text;
    if (seen[k]) return;
    seen[k] = true;
    items.push({ group: group, text: text });
  }
  matched.forEach(function (rule) {
    rule.checks.forEach(function (c) { add(rule.group, c); });
  });
  if (items.length === 0) {
    DEFAULT_CHECKS.forEach(function (c) { add(DEFAULT_GROUP, c); });
    return { items: items, usedDefault: true };
  }
  return { items: items, usedDefault: false };
}

function csvCell(value) {
  var s = String(value);
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  if (/[;"\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function toCsv(items) {
  var lines = ['№;Группа;Проверка;Статус'];
  items.forEach(function (it, i) {
    lines.push([i + 1, csvCell(it.group), csvCell(it.text), 'не проверено'].join(';'));
  });
  return '﻿' + lines.join('\r\n') + '\r\n';
}

// ---- DOM-обвязка ----
function renderResult(container, items) {
  container.textContent = '';
  var groups = [];
  var byGroup = {};
  items.forEach(function (it) {
    if (!byGroup[it.group]) { byGroup[it.group] = []; groups.push(it.group); }
    byGroup[it.group].push(it.text);
  });
  groups.forEach(function (g) {
    var h = document.createElement('h3');
    h.textContent = g;
    var ul = document.createElement('ul');
    byGroup[g].forEach(function (t) {
      var li = document.createElement('li');
      li.textContent = t;
      ul.appendChild(li);
    });
    container.appendChild(h);
    container.appendChild(ul);
  });
}

function downloadCsv(items) {
  var blob = new Blob([toCsv(items)], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'checklist.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 0);
}

var currentItems = [];

function onBuild() {
  var desc = document.getElementById('desc').value;
  var hint = document.getElementById('hint');
  var csvBtn = document.getElementById('csv');
  var result = buildChecklist(desc, []);
  currentItems = result.items;
  renderResult(document.getElementById('result'), currentItems);
  csvBtn.hidden = currentItems.length === 0;
  if (currentItems.length === 0) hint.textContent = 'Опишите фичу';
  else if (result.usedDefault) hint.textContent = 'Нет подходящих ключевых слов, показан общий набор';
  else hint.textContent = '';
}

if (typeof document !== 'undefined') {
  document.getElementById('build').addEventListener('click', onBuild);
  document.getElementById('csv').addEventListener('click', function () { downloadCsv(currentItems); });
}
</script>
</body>
</html>
